<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibos — Esfiha da Casa</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --red: #C8232B; --cream: #FFF3DC; --ink: #3A1F12; --ink-soft: #6B4A38; --verde: #1E8C46;
    --line: rgba(58,31,18,0.14); --card: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--cream); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.5; padding-bottom: 70px;
  }
  header { position: sticky; top: 0; z-index: 5; background: var(--cream); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 1.15rem; margin: 0; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 14px 16px 30px; }
  .login { max-width: 320px; margin: 80px auto; text-align: center; }
  .login input { width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid var(--line); margin-bottom: 10px; font-size: 1rem; }
  .login button, .filtros input, .filtros button { font-family: inherit; }
  button.primario { background: var(--red); color: #fff; border: none; border-radius: 10px; padding: 11px 18px; font-weight: 700; cursor: pointer; }
  .filtros { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .filtros input[type="date"] { padding: 9px 10px; border-radius: 8px; border: 1.5px solid var(--line); }
  .filtros button { border: 1.5px solid var(--line); background: transparent; border-radius: 8px; padding: 9px 12px; cursor: pointer; font-weight: 700; color: var(--ink-soft); }
  .filtros button.on, .filtros button:hover { background: var(--red); border-color: var(--red); color: #fff; }
  .resumo { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 0.9rem; display: flex; gap: 18px; flex-wrap: wrap; }
  .resumo b { display: block; font-size: 1.15rem; }
  .vazio { text-align: center; color: var(--ink-soft); padding: 40px 0; }
  .pendentes { background: #FFF7E8; border: 1.5px solid #F0C34D; border-radius: 12px; padding: 12px 14px; margin-bottom: 20px; }
  .pendentes h2 { font-size: 0.98rem; margin: 0 0 8px; color: #8A5A00; }
  .pendentes .linha { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed rgba(138,90,0,0.25); font-size: 0.88rem; }
  .pendentes .linha:last-child { border-bottom: none; }
  .pendentes .linha b { display: block; }
  .pendentes button { background: #8A5A00; color: #fff; border: none; border-radius: 8px; padding: 7px 10px; font-weight: 700; font-size: 0.82rem; cursor: pointer; white-space: nowrap; }

  /* --- Recibo (estilo talão, uma folha por encomenda) --- */
  .recibo { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 26px 20px; margin-bottom: 20px; }
  .recibo .cabecalho { text-align: center; margin-bottom: 2px; }
  .recibo .cabecalho img { width: 56px; height: 56px; border-radius: 12px; display: block; margin: 0 auto 6px; }
  .recibo .loja { font-size: 1.4rem; font-weight: 800; letter-spacing: 0.01em; }
  .recibo .subloja { text-align: center; font-size: 0.78rem; color: var(--ink-soft); margin-bottom: 14px; }
  table.itens { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
  table.itens th { text-align: left; font-weight: 700; font-size: 0.95rem; border-bottom: 2px solid var(--ink); padding: 0 0 6px; }
  table.itens th.preco, table.itens td.preco { text-align: right; white-space: nowrap; }
  table.itens td { padding: 7px 0; font-size: 0.92rem; border-bottom: 1px dashed var(--line); vertical-align: top; }
  table.itens td.preco { font-weight: 700; }
  table.itens tr.sub td { border-bottom: none; padding: 1px 0 1px 14px; font-size: 0.8rem; color: var(--ink-soft); }
  table.itens tr.sub td.preco { font-weight: 400; }
  .linha-resumo { display: flex; justify-content: space-between; font-size: 0.88rem; padding: 5px 0; color: var(--ink-soft); }
  .linha-total { display: flex; justify-content: space-between; border-top: 2px solid var(--ink); margin-top: 4px; padding-top: 8px; font-weight: 800; font-size: 1.05rem; }
  .linha-pago { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1px solid var(--ink); margin-top: 10px; padding-top: 10px; font-size: 0.88rem; }
  .linha-pago .metodo b { display: block; font-size: 0.95rem; }
  .linha-pago .valor { font-weight: 700; }
  .endereco { font-size: 1.05rem; font-weight: 700; color: var(--ink); margin: 2px 0 14px; line-height: 1.4; }
  .rodape { text-align: center; font-size: 0.82rem; color: var(--ink-soft); margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .rodape .num { font-weight: 700; color: var(--ink); }

  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--line); display: flex; z-index: 10; }
  .nav-i { flex: 1; text-align: center; padding: 9px 0 7px; color: var(--ink-soft); text-decoration: none; font-size: 0.72rem; font-weight: 700; border: none; background: none; font-family: inherit; }
  .nav-i span { display: block; font-size: 1.2rem; }
  .nav-i.on { color: var(--red); }
  .cab-impressao { display: none; }
  @media print {
    .cab-impressao { display: flex; align-items: center; gap: 14px; border-bottom: 2px solid #C8232B; padding-bottom: 10px; margin-bottom: 14px; }
    .cab-impressao img { width: 56px; height: 56px; border-radius: 12px; }
    .cab-impressao .t1 { font-size: 1.3rem; font-weight: 800; }
    .cab-impressao .t2 { font-size: 1rem; font-weight: 700; }
    .cab-impressao .t3 { font-size: 0.78rem; color: #666; }
    #vistaMes table { page-break-inside: auto; } #vistaMes tr { break-inside: avoid; }
    @page { size: A4; margin: 14mm; }
    header, .filtros, .nav, .no-print { display: none !important; }
    body { background: #fff; padding-bottom: 0; }
    .recibo { break-inside: avoid; border: 1px solid #999; box-shadow: none; }
  }
</style>
</head>
<body>

<div id="login" class="login">
  <h1>🧾 Recibos</h1>
  <p style="color:var(--ink-soft);font-size:0.9rem;">Mesma palavra-passe do painel.</p>
  <input type="password" id="pass" placeholder="Senha">
  <button class="primario" onclick="entrar()" style="width:100%">Entrar</button>
  <p id="erro" style="color:var(--red);font-size:0.85rem;"></p>
</div>

<div id="app" style="display:none">
  <header>
    <h1>🧾 Recibos do dia</h1>
    <span class="hora" id="hora" style="font-size:0.85rem;color:var(--ink-soft)"></span>
  </header>
  <div class="wrap">
    <div class="filtros no-print">
      <button id="btDia" onclick="setModo('dia')" style="font-weight:800">📅 Dia</button>
      <button id="btMes" onclick="setModo('mes')">🗓️ Mês</button>
    </div>
    <div id="vistaDia">
    <div id="voltarMes" class="no-print" style="display:none;margin-bottom:10px"><button onclick="history.back()" style="border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:9px 14px;font-weight:800;color:var(--red);cursor:pointer;font-family:inherit">← Voltar ao mês</button></div>
    <div class="filtros no-print">
      <input type="date" id="diaSel" onchange="carregar()">
      <button onclick="hoje()">Hoje</button>
      <button onclick="ontem()">Ontem</button>
      <button onclick="window.print()">🖨️ Imprimir</button>
      <button onclick="gerarPdfDia()">📄 Guardar PDF do dia</button>
    </div>
    <div id="caixaDia" class="no-print"></div>
    <div class="resumo" id="resumo"></div>
    <div id="lista"></div>
    <div id="porConfirmar" class="no-print"></div>
    </div>
    <div id="vistaMes" style="display:none">
      <div class="filtros no-print">
        <div id="mesNav"></div><input type="hidden" id="mesSel">
        <button onclick="exportarMesCsv()">⬇️ Exportar mês (CSV)</button>
        <button onclick="gerarPdfMes(false)">📄 PDF resumo do mês</button>
        <button onclick="gerarPdfMes(true)">📚 PDF do mês com recibos de cada dia</button>
      </div>
      <div id="mesConteudo"></div>
    </div>
  </div>
  <nav class="nav no-print">
    <a class="nav-i" href="/painel/"><span>🫓</span>Pedidos</a>
    <a class="nav-i" href="/admin/"><span>📊</span>Análise</a>
    <a class="nav-i on" href="/painel/recibos.html"><span>🧾</span>Recibos</a>
    <a class="nav-i" href="/painel/caixa.html"><span>💰</span>Caixa</a>
    <a class="nav-i" href="/painel/seguranca.html"><span>🧴</span>Higiene</a>
  </nav>
</div>

<script src="/painel/jspdf.umd.min.js"></script>
<script src="/painel/pdf-util.js"></script>
<script>
  const API = '/api';
  let pass = '';

  function eur(v) { return (v || 0).toFixed(2).replace('.', ',') + '€'; }
  function eurCent(c) { return eur((c || 0) / 100); }
  function dadosDe(p) {
    let d = null;
    try { d = JSON.parse(p.itens || 'null'); } catch (e) {}
    if (Array.isArray(d)) return { linhas: d, producao: null, bebidas: null };
    return d || { linhas: [], producao: null, bebidas: null };
  }
  // Mesma regra do painel principal: pedidos antigos sem metodo gravado
  // mostram as duas opcoes possiveis.
  function metodoPagamentoLabel(p) {
    const dados = dadosDe(p);
    const info = dados.pagamento || dados.entrega || {};
    if (info.metodo_pagamento === 'dinheiro') {
      const tc = info.troco_para_cent; // valor da NOTA com que o cliente paga, nao o troco
      if (tc) {
        const trocoReal = Math.max(0, tc - (p.total_cent || 0));
        return `💵 Dinheiro — paga com nota de ${eur(tc / 100)} (troco ${eur(trocoReal / 100)})`;
      }
      return '💵 Dinheiro — sem troco';
    }
    if (info.metodo_pagamento === 'mbway') return '💳 MB Way';
    return p.modo === 'entrega' ? '💳 MB Way' : '💳 MB Way ou 💵 Dinheiro (na retirada)';
  }
  function metodoDe(p) {
    const info = dadosDe(p).pagamento || dadosDe(p).entrega || {};
    return info.metodo_pagamento === 'mbway' ? 'mbway' : (info.metodo_pagamento === 'dinheiro' ? 'dinheiro' : 'indefinido');
  }
  function esc(t) { return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function horaDe(iso) { try { return new Date(iso).toLocaleTimeString('pt-PT', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function dataHoraDe(iso) { try { return new Date(iso).toLocaleDateString('pt-PT') + ', ' + horaDe(iso); } catch (e) { return ''; } }
  function diaLisboaHoje(offsetDias = 0) {
    const d = new Date(Date.now() + offsetDias * 86400000);
    return new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Lisbon' }).format(d); // AAAA-MM-DD
  }
  function dadosDe(p) {
    let d = null;
    try { d = JSON.parse(p.itens || 'null'); } catch (e) {}
    if (Array.isArray(d)) return { linhas: d, producao: null, bebidas: null, entrega: null };
    return d || { linhas: [], producao: null, bebidas: null, entrega: null };
  }

  async function api(caminho, opcoes) {
    const r = await fetch(API + caminho, Object.assign({
      headers: Object.assign({ 'x-painel-pass': pass }, (opcoes && opcoes.body) ? { 'Content-Type': 'application/json' } : {}),
    }, opcoes || {}));
    if (r.status === 401) throw new Error('401');
    return r.json();
  }

  async function marcarPagoAqui(id) {
    await api('/painel/pedido', { method: 'POST', body: JSON.stringify({ id, pago: 1 }) });
    carregar();
  }

  async function entrar() {
    pass = document.getElementById('pass').value;
    try {
      await api('/painel/pedidos');
      try { localStorage.setItem('painelPass', pass); } catch (e) {}
      document.getElementById('login').style.display = 'none';
      document.getElementById('app').style.display = '';
      document.getElementById('diaSel').value = diaLisboaHoje();
      NAVD.diaInit('diaSel', carregar);
      relogio(); setInterval(relogio, 1000);
      carregar();
    } catch (e) {
      document.getElementById('erro').textContent = 'Senha errada.';
    }
  }

  function relogio() {
    document.getElementById('hora').textContent = new Date().toLocaleTimeString('pt-PT');
  }

  function hoje() { document.getElementById('diaSel').value = diaLisboaHoje(); carregar(); }
  function ontem() { document.getElementById('diaSel').value = diaLisboaHoje(-1); carregar(); }

  // As linhas guardadas em cada pedido já vêm com o preço certo de cada
  // item (ex.: "A Tradicional — 2,50€"), incluindo combos com o preço do
  // pacote na linha principal e os sabores/bebidas incluídos por baixo,
  // sem preço próprio (porque já vêm embutidos no preço do combo).
  function linhasTabela(d) {
    const linhas = (d.linhas && d.linhas.length) ? d.linhas : [];
    return linhas.map(l => {
      const indentada = /^\s{2,}/.test(l);
      const m = l.match(/^(.*?)\s—\s([\d,]+€)\s*$/);
      if (m) return { texto: m[1].trim(), preco: m[2], sub: indentada };
      return { texto: l.trim(), preco: '', sub: indentada };
    });
  }

  function itensTabela(d) {
    const linhas = linhasTabela(d);
    if (!linhas.length) {
      return '<table class="itens"><thead><tr><th>Itens</th><th class="preco">Preço</th></tr></thead>' +
             '<tbody><tr><td colspan="2">(sem detalhe)</td></tr></tbody></table>';
    }
    const corpo = linhas.map(l => `
      <tr${l.sub ? ' class="sub"' : ''}><td>${esc(l.texto)}</td><td class="preco">${l.preco ? esc(l.preco) : ''}</td></tr>`).join('');
    return `<table class="itens"><thead><tr><th>Itens</th><th class="preco">Preço</th></tr></thead><tbody>${corpo}</tbody></table>`;
  }

  function enderecoHtml(p) {
    if (p.modo === 'entrega') {
      const d = dadosDe(p);
      const cp = (d.entrega && d.entrega.codigo_postal) ? String(d.entrega.codigo_postal).trim() : '';
      const partes = [p.morada, p.localidade].filter(Boolean).map(esc).join(', ');
      return `<p class="endereco">🛵 Entrega — ${partes || 'morada não indicada'}${cp ? ' · ' + esc(cp) : ''}${p.telefone ? ' · Tel: ' + esc(p.telefone) : ''}</p>`;
    }
    return `<p class="endereco">🧺 Retirada no local${p.telefone ? ' · Tel: ' + esc(p.telefone) : ''}</p>`;
  }

  async function carregar() {
    const dia = document.getElementById('diaSel').value;
    const r = await api('/painel/pedidos?dia=' + encodeURIComponent(dia));
    // Todas as entregas reais do dia (pagas ou nao) -- usado so para o
    // calculo da Andreza, que e paga pelas entregas feitas, nao pelas ja
    // confirmadas como pagas no painel (ver bot de pagamentos, ponto 4).
    const entregasReaisDia = (r.pedidos || []).filter(p => !p.ensaio && p.estado !== 'cancelado' && p.modo === 'entrega');
    const pedidos = (r.pedidos || [])
      .filter(p => !p.ensaio && p.pago && p.estado !== 'cancelado')
      .sort((a, b) => (a.criado_em || '').localeCompare(b.criado_em || ''));
    // Pedidos reais do dia que ainda NAO foram marcados como pagos --
    // e exatamente por isto que um recibo "parece" estar em falta aqui:
    // o pedido existe, mas falta alguem carregar em "Marcar pago".
    const pendentes = (r.pedidos || [])
      .filter(p => !p.ensaio && !p.pago && p.estado !== 'cancelado')
      .sort((a, b) => (a.criado_em || '').localeCompare(b.criado_em || ''));

    const divPendentes = document.getElementById('porConfirmar');
    if (pendentes.length) {
      const totalPendente = pendentes.reduce((a, p) => a + (p.total_cent || 0), 0);
      divPendentes.innerHTML = `
        <div class="pendentes">
          <h2>⏳ Por confirmar o pagamento (${pendentes.length}, ${eurCent(totalPendente)})</h2>
          ${pendentes.map(p => `
            <div class="linha">
              <span><b>Pedido #${p.numero}</b>${p.nome ? ' · ' + esc(p.nome) : ''} · ${horaDe(p.criado_em)} · ${metodoPagamentoLabel(p)} · ${eurCent(p.total_cent)}</span>
              <button onclick="marcarPagoAqui(${p.id})">Marcar pago</button>
            </div>`).join('')}
        </div>`;
    } else {
      divPendentes.innerHTML = '';
    }

    const lista = document.getElementById('lista');
    const resumo = document.getElementById('resumo');

    // Caixa do dia: compara o que os recibos dizem com o que foi confirmado
    // na Caixa e deixa confirmar com um toque.
    mostrarCaixaDia(dia,
      pedidos.filter(p => metodoDe(p) === 'dinheiro').reduce((a, p) => a + (p.total_cent || 0), 0),
      pedidos.filter(p => metodoDe(p) === 'mbway').reduce((a, p) => a + (p.total_cent || 0), 0),
      pendentes.length);

    if (!pedidos.length) {
      lista.innerHTML = '<div class="vazio">Sem pedidos pagos neste dia.</div>';
      resumo.innerHTML = '';
      return;
    }

    let total = 0;
    let esfihasPagas = 0, esfihasGratis = 0;
    let html = '';
    pedidos.forEach((p, i) => {
      total += p.total_cent || 0;
      (dadosDe(p).producao || []).forEach(x => {
        const n = x.n || 0, gratis = x.gratis || 0;
        esfihasPagas += Math.max(0, n - gratis);
        esfihasGratis += gratis;
      });
      html += `
        <div class="recibo">
          <div class="cabecalho">
            <img src="/icon-512.png" alt="Esfiha da Casa">
            <div class="loja">Esfiha da Casa</div>
          </div>
          <div class="subloja">Pedido #${p.numero} · ${horaDe(p.criado_em)}</div>
          ${p.nome ? `<p class="endereco" style="font-weight:800;font-size:1rem;color:var(--ink);margin-bottom:2px">👤 ${esc(p.nome)}</p>` : ''}
          ${enderecoHtml(p)}
          ${p.telefone ? `<p class="endereco" style="margin-top:-8px">📞 ${esc(p.telefone)}</p>` : ''}
          <div class="linha-total"><span>Total a cobrar</span><span>${eurCent(p.total_cent)}</span></div>
          <div class="linha-pago"><span class="metodo">${metodoPagamentoLabel(p)}</span></div>
        </div>`;
    });
    lista.innerHTML = html;

    // Quantos recibos vieram de entrega (estafeta) vs levantamento no local,
    // e as taxas de entrega desse dia -- mesma regra do painel: 3,50€ por
    // entrega, sem minimo garantido (a partir de 23/10 e o proprio Miguel
    // que faz as entregas).
    const totalDinheiro = pedidos.filter(p => metodoDe(p) === 'dinheiro').reduce((a, p) => a + (p.total_cent || 0), 0);
    const totalMbway = pedidos.filter(p => metodoDe(p) === 'mbway').reduce((a, p) => a + (p.total_cent || 0), 0);
    const totalIndefinido = total - totalDinheiro - totalMbway;
    const entregas = pedidos.filter(p => p.modo === 'entrega').length;
    const retiradas = pedidos.length - entregas;
    const entregasAndreza = entregasReaisDia.length;
    let andrezaHtml = '';
    if (entregasAndreza) {
      const taxa = entregasAndreza * 3.5;
      andrezaHtml = `
      <div><b>${eur(taxa)}</b>taxas de entrega</div>`;
    }
    resumo.innerHTML = `
      <div><b>${pedidos.length}</b>recibos</div>
      <div><b>${eurCent(total)}</b>total do dia</div>
      <div><b>💵 ${eurCent(totalDinheiro)}</b>em dinheiro</div>
      <div><b>💳 ${eurCent(totalMbway)}</b>em MB Way</div>
      ${totalIndefinido ? `<div><b>${eurCent(totalIndefinido)}</b>método não registado</div>` : ''}
      <div><b>${entregas}</b>entregas (estafeta)</div>
      <div><b>${retiradas}</b>levantamentos</div>
      <div><b>${esfihasPagas}</b>esfihas pagas</div>
      <div><b>${esfihasGratis}</b>esfihas em oferta</div>${andrezaHtml}`;
  }

  // ---------- Caixa junto aos recibos ----------
  const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const fmtNum = v => v.toFixed(2).replace('.', ',');
  function estadoCaixa(fecho, din, mb, nPend) {
    // devolve {tipo, texto}
    if (!fecho) return { tipo: 'por', texto: din || mb || nPend ? '⏳ Caixa por confirmar' : 'sem movimento' };
    const dD = (fecho.dinheiro_confirmado_cent || 0) - din, dM = (fecho.mbway_confirmado_cent || 0) - mb;
    if (Math.abs(dD) >= 1 || Math.abs(dM) >= 1) {
      const partes = [];
      if (Math.abs(dD) >= 1) partes.push(`💵 ${dD > 0 ? '+' : '-'}${eurCent(Math.abs(dD))}`);
      if (Math.abs(dM) >= 1) partes.push(`💳 ${dM > 0 ? '+' : '-'}${eurCent(Math.abs(dM))}`);
      return { tipo: 'dif', texto: '⚠️ Diferença: ' + partes.join(' · ') };
    }
    return { tipo: 'ok', texto: '✅ Caixa confirmada' };
  }
  async function mostrarCaixaDia(dia, din, mb, nPend) {
    const box = document.getElementById('caixaDia');
    let fecho = null;
    try { const r = await api('/painel/fecho-caixa?dia=' + encodeURIComponent(dia)); fecho = r.fecho || null; } catch (e) {}
    const st = estadoCaixa(fecho, din, mb, nPend);
    if (st.tipo === 'por' && !din && !mb && !nPend) { box.innerHTML = ''; return; }
    const cor = st.tipo === 'ok' ? 'var(--verde)' : (st.tipo === 'dif' ? 'var(--red)' : '#8A5A00');
    box.innerHTML = `<div class="pendentes" style="border-color:${cor}">
      <div class="linha"><span><b style="color:${cor}">${st.texto}</b><br><small>Recibos: 💵 ${eurCent(din)} · 💳 ${eurCent(mb)}${fecho ? ` — Caixa: 💵 ${eurCent(fecho.dinheiro_confirmado_cent)} · 💳 ${eurCent(fecho.mbway_confirmado_cent)}` : ''}</small></span>
      <a class="no-print" href="/painel/caixa.html?dia=${dia}" style="color:var(--red);font-weight:800;white-space:nowrap">${st.tipo === 'ok' ? 'ver caixa' : 'confirmar na caixa'} →</a></div></div>`;
  }

  // ---------- Vista mensal ----------
  let modo = 'dia';
  let mesDados = [];
  let mesPedidos = [];
  let veioDoMes = false;
  function setModo(m, doMes) {
    modo = m;
    veioDoMes = !!(m === 'dia' && doMes);
    document.getElementById('voltarMes').style.display = veioDoMes ? '' : 'none';
    document.getElementById('vistaDia').style.display = m === 'dia' ? '' : 'none';
    document.getElementById('vistaMes').style.display = m === 'mes' ? '' : 'none';
    document.getElementById('btDia').style.fontWeight = m === 'dia' ? '800' : '';
    document.getElementById('btMes').style.fontWeight = m === 'mes' ? '800' : '';
    if (m === 'mes') {
      NAVD.mesInit('mesSel', 'mesNav', carregarMes, diaLisboaHoje().slice(0, 7));
      const el = document.getElementById('mesSel');
      if (!el.value) NAVD.setMes('mesSel', document.getElementById('diaSel').value.slice(0, 7) || diaLisboaHoje().slice(0, 7));
      carregarMes();
    } else carregar();
  }
  function abrirDia(dia) {
    document.getElementById('diaSel').value = dia;
    try { history.pushState({ dia: 1 }, ''); } catch (e) {}
    setModo('dia', true); window.scrollTo({ top: 0 });
  }
  // gesto/botao "voltar" do telemovel regressa ao mes
  window.addEventListener('popstate', () => { if (modo === 'dia' && veioDoMes) setModo('mes'); });

  function calcMes(pedidosMes, fechos) {
    const reais = pedidosMes.filter(p => !p.ensaio && p.estado !== 'cancelado');
    const dias = {};
    reais.forEach(p => {
      const d = dias[p.dia] || (dias[p.dia] = { dia: p.dia, n: 0, ent: 0, ret: 0, din: 0, mb: 0, total: 0, pend: 0, pendCent: 0, esf: 0 });
      if (!p.pago) { d.pend++; d.pendCent += p.total_cent || 0; return; }
      d.n++; d.total += p.total_cent || 0;
      if (p.modo === 'entrega') d.ent++; else d.ret++;
      const m = metodoDe(p);
      if (m === 'dinheiro') d.din += p.total_cent || 0; else if (m === 'mbway') d.mb += p.total_cent || 0;
      d.esf += p.n_esfihas || 0;
    });
    const mapaF = {}; (fechos || []).forEach(f => { mapaF[f.dia] = f; });
    return Object.values(dias).sort((a, b) => a.dia < b.dia ? -1 : 1).map(d => Object.assign(d, { fecho: mapaF[d.dia] || null, st: estadoCaixa(mapaF[d.dia] || null, d.din, d.mb, d.pend) }));
  }

  async function carregarMes() {
    const m = document.getElementById('mesSel').value;
    if (!m) return;
    const [r, rf] = await Promise.all([api('/painel/pedidos?mes=' + encodeURIComponent(m)), api('/painel/fecho-caixa?dias=366')]);
    mesPedidos = r.pedidos || [];
    mesDados = calcMes(mesPedidos, rf.historico || []);
    const div = document.getElementById('mesConteudo');
    const nomeMes = MESES[parseInt(m.slice(5, 7), 10) - 1] + ' ' + m.slice(0, 4);
    if (!mesDados.length) { div.innerHTML = `<div class="vazio">Sem pedidos em ${nomeMes}.</div>`; return; }
    const T = mesDados.reduce((a, d) => { ['n','ent','ret','din','mb','total','pend','pendCent','esf'].forEach(k => a[k] += d[k]); return a; }, { n:0, ent:0, ret:0, din:0, mb:0, total:0, pend:0, pendCent:0, esf:0 });
    const porConf = mesDados.filter(d => d.st.tipo !== 'ok' && d.st.tipo !== undefined && (d.n || d.pend) && d.st.texto !== 'sem movimento').length;
    const dd = d => { const [y, mo, di] = d.split('-'); const w = ['dom','seg','ter','qua','qui','sex','sáb'][new Date(+y, +mo - 1, +di).getDay()]; return `${w}, ${di}/${mo}`; };
    div.innerHTML = `
      <div class="resumo">
        <div><b>${T.n}</b>recibos</div>
        <div><b>${eurCent(T.total)}</b>total do mês</div>
        <div><b>💵 ${eurCent(T.din)}</b>em dinheiro</div>
        <div><b>💳 ${eurCent(T.mb)}</b>em MB Way</div>
        <div><b>${T.ent}</b>entregas</div>
        <div><b>${T.ret}</b>levantamentos</div>
        <div><b>${T.esf}</b>esfihas</div>
        <div><b>${mesDados.length}</b>dias com pedidos</div>
      </div>
      ${T.pend ? `<div class="pendentes"><h2>⏳ ${T.pend} pedido(s) por marcar como pago (${eurCent(T.pendCent)})</h2><div class="linha no-print"><span>Abre o dia indicado na tabela para os marcar.</span></div></div>` : ''}
      ${porConf ? `<div class="pendentes"><h2>💰 ${porConf} dia(s) com a caixa por confirmar ou com diferença</h2></div>` : ''}
      <table class="itens" style="width:100%;font-size:0.85rem">
        <thead><tr><th>Dia</th><th class="preco">Rec.</th><th class="preco">💵</th><th class="preco">💳</th><th class="preco">Total</th><th style="padding-left:12px">Caixa</th></tr></thead>
        <tbody>${mesDados.map(d => `
          <tr style="cursor:pointer" onclick="abrirDia('${d.dia}')">
            <td><b>${dd(d.dia)}</b><div style="font-size:0.75rem;color:var(--ink-soft)">${d.ent} ent. · ${d.ret} lev.${d.pend ? ` · <span style="color:var(--red)">${d.pend} por pagar</span>` : ''}</div></td>
            <td class="preco">${d.n}</td><td class="preco">${eurCent(d.din)}</td><td class="preco">${eurCent(d.mb)}</td><td class="preco"><b>${eurCent(d.total)}</b></td>
            <td style="font-size:0.78rem;padding-left:12px">${d.st.texto}</td></tr>`).join('')}
        </tbody>
        <tfoot><tr style="font-weight:800;border-top:2px solid var(--line)"><td>Total</td><td class="preco">${T.n}</td><td class="preco">${eurCent(T.din)}</td><td class="preco">${eurCent(T.mb)}</td><td class="preco">${eurCent(T.total)}</td><td></td></tr></tfoot>
      </table>
      <div class="no-print" style="font-size:0.78rem;color:var(--ink-soft);margin-top:8px">Toca num dia para ver os recibos desse dia. Só entram pedidos pagos nos totais; cancelados e ensaios ficam de fora.</div>`;
  }

  function exportarMesCsv() {
    if (!mesDados.length) return;
    const m = document.getElementById('mesSel').value;
    const e = c => fmtNum((c || 0) / 100);
    const L = [['Dia', 'Recibos', 'Entregas', 'Levantamentos', 'Esfihas', 'Dinheiro (EUR)', 'MB Way (EUR)', 'Total (EUR)', 'Por pagar (nº)', 'Caixa dinheiro confirmado (EUR)', 'Caixa MB Way confirmado (EUR)', 'Estado da caixa']];
    const strip = t => t.replace(/[✅⏳⚠️💵💳]/gu, '').trim();
    mesDados.forEach(d => L.push([d.dia, d.n, d.ent, d.ret, d.esf, e(d.din), e(d.mb), e(d.total), d.pend, d.fecho ? e(d.fecho.dinheiro_confirmado_cent) : '', d.fecho ? e(d.fecho.mbway_confirmado_cent) : '', strip(d.st.texto)]));
    const T = mesDados.reduce((a, d) => { ['n','ent','ret','esf','din','mb','total','pend'].forEach(k => a[k] += d[k]); return a; }, { n:0, ent:0, ret:0, esf:0, din:0, mb:0, total:0, pend:0 });
    L.push(['TOTAL DO MÊS', T.n, T.ent, T.ret, T.esf, e(T.din), e(T.mb), e(T.total), T.pend, '', '', '']);
    const csv = '﻿' + L.map(l => l.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
    a.download = 'recibos-esfiha-da-casa-' + m + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
  }

  // ---------- PDFs (guardados direto, sem passar pela impressao) ----------
  const dataLongaPdf = d => { const [y, m, di] = d.split('-').map(Number); return new Date(y, m - 1, di).toLocaleDateString('pt-PT', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }); };
  const corEstado = t => t === 'ok' ? PDFU.VERDE : (t === 'dif' ? PDFU.VERMELHO : PDFU.AMBAR);

  function pdfRecibo(c, p) {
    const d = c.doc, X = PDFU.MX + 4, W = PDFU.UTIL - 8;
    const dados = dadosDe(p);
    const cp = (dados.entrega && dados.entrega.codigo_postal) ? String(dados.entrega.codigo_postal).trim() : '';
    const addr = p.modo === 'entrega'
      ? 'Entrega — ' + ([p.morada, p.localidade].filter(Boolean).join(', ') || 'morada não indicada') + (cp ? ' · ' + cp : '')
      : 'Retirada no local';
    const tel = p.telefone ? 'Tel: ' + p.telefone : '';
    d.setFont('helvetica', 'normal'); d.setFontSize(9);
    const addrL = d.splitTextToSize(PDFU.limpa(addr + (tel ? ' · ' + tel : '')), W);
    const itens = linhasTabela(dados);
    const metodo = PDFU.limpa(metodoPagamentoLabel(p));
    const h = 8 + addrL.length * 4.2 + Math.max(1, itens.length) * 4.4 + 16;
    c.precisa(h + 3);
    const top = c.y - 4;
    d.setDrawColor(200, 190, 175); d.setLineWidth(0.3); d.roundedRect(PDFU.MX, top, PDFU.UTIL, h, 2, 2);
    let y = c.y + 1;
    d.setFont('helvetica', 'bold'); d.setFontSize(10.5); d.setTextColor.apply(d, PDFU.TINTA);
    d.text(PDFU.limpa('Pedido #' + p.numero + ' · ' + horaDe(p.criado_em) + (p.nome ? ' · ' + p.nome : '')), X, y); y += 5.2;
    d.setFont('helvetica', 'normal'); d.setFontSize(9); d.setTextColor.apply(d, PDFU.CINZA);
    d.text(addrL, X, y); y += addrL.length * 4.2 + 1.5;
    d.setTextColor.apply(d, PDFU.TINTA); d.setFontSize(9);
    (itens.length ? itens : [{ texto: '(sem detalhe)', preco: '', sub: false }]).forEach(l => {
      d.setTextColor.apply(d, l.sub ? PDFU.CINZA : PDFU.TINTA);
      d.text(PDFU.limpa(l.texto), X + (l.sub ? 4 : 0), y);
      if (l.preco) d.text(PDFU.limpa(l.preco), PDFU.LARG - PDFU.MX - 4, y, { align: 'right' });
      y += 4.4;
    });
    y += 1.2; d.setDrawColor(200, 190, 175); d.line(X, y - 3, PDFU.LARG - PDFU.MX - 4, y - 3);
    d.setFont('helvetica', 'bold'); d.setFontSize(10.5); d.setTextColor.apply(d, PDFU.TINTA);
    d.text('Total', X, y + 1); d.text(PDFU.limpa(eurCent(p.total_cent)), PDFU.LARG - PDFU.MX - 4, y + 1, { align: 'right' });
    d.setFont('helvetica', 'normal'); d.setFontSize(8.5); d.setTextColor.apply(d, PDFU.CINZA);
    d.text(metodo, X, y + 6);
    c.y = top + h + 5;
  }

  function pdfSecaoDia(c, dia, reais, fecho) {
    const pagos = reais.filter(p => p.pago), pend = reais.filter(p => !p.pago);
    let din = 0, mb = 0, total = 0, ent = 0, ret = 0, esf = 0;
    pagos.forEach(p => {
      total += p.total_cent || 0; if (p.modo === 'entrega') ent++; else ret++;
      const m = metodoDe(p); if (m === 'dinheiro') din += p.total_cent || 0; else if (m === 'mbway') mb += p.total_cent || 0;
      esf += p.n_esfihas || 0;
    });
    c.titulo2(dataLongaPdf(dia).replace(/^./, x => x.toUpperCase()), PDFU.VERMELHO);
    c.resumo([[String(pagos.length), 'recibos'], [eurCent(total), 'total do dia'], [eurCent(din), 'em dinheiro'], [eurCent(mb), 'em MB Way'],
              [String(ent), 'entregas'], [String(ret), 'levantamentos'], [String(esf), 'esfihas'], [String(pend.length), 'por pagar']], 4);
    const st = estadoCaixa(fecho, din, mb, pend.length);
    c.aviso(st.texto + (fecho ? '   (Caixa: dinheiro ' + eurCent(fecho.dinheiro_confirmado_cent) + ' · MB Way ' + eurCent(fecho.mbway_confirmado_cent) + ')' : ''), corEstado(st.tipo));
    if (pend.length) {
      c.texto('Por marcar como pago: ' + pend.map(p => '#' + p.numero + (p.nome ? ' ' + p.nome : '') + ' ' + eurCent(p.total_cent)).join(' · '), { cor: PDFU.AMBAR, bold: true, depois: 4 });
    }
    pagos.sort((a, b) => (a.criado_em || '').localeCompare(b.criado_em || '')).forEach(p => pdfRecibo(c, p));
    if (!pagos.length) c.texto('Sem recibos pagos neste dia.', { cor: PDFU.CINZA });
  }

  async function gerarPdfDia() {
    const dia = document.getElementById('diaSel').value;
    const [r, rf] = await Promise.all([api('/painel/pedidos?dia=' + encodeURIComponent(dia)), api('/painel/fecho-caixa?dia=' + encodeURIComponent(dia))]);
    const reais = (r.pedidos || []).filter(p => !p.ensaio && p.estado !== 'cancelado');
    const c = await PDFU.novo('Recibos do dia ' + dia.split('-').reverse().join('/'), 'Gerado em ' + new Date().toLocaleDateString('pt-PT') + ' · só pedidos pagos nos totais');
    pdfSecaoDia(c, dia, reais, rf.fecho || null);
    c.guardar('recibos-esfiha-da-casa-' + dia + '.pdf');
  }

  async function gerarPdfMes(detalhe) {
    if (!mesDados.length) return;
    const m = document.getElementById('mesSel').value;
    const nomeMes = MESES[parseInt(m.slice(5, 7), 10) - 1] + ' ' + m.slice(0, 4);
    const c = await PDFU.novo('Recibos — ' + nomeMes, 'Gerado em ' + new Date().toLocaleDateString('pt-PT') + ' · só pedidos pagos nos totais (cancelados e ensaios excluídos)');
    const T = mesDados.reduce((a, d) => { ['n','ent','ret','din','mb','total','pend','pendCent','esf'].forEach(k => a[k] += d[k]); return a; }, { n:0, ent:0, ret:0, din:0, mb:0, total:0, pend:0, pendCent:0, esf:0 });
    c.resumo([[String(T.n), 'recibos'], [eurCent(T.total), 'total do mês'], [eurCent(T.din), 'em dinheiro'], [eurCent(T.mb), 'em MB Way'],
              [String(T.ent), 'entregas'], [String(T.ret), 'levantamentos'], [String(T.esf), 'esfihas'], [String(mesDados.length), 'dias com pedidos']], 4);
    if (T.pend) c.aviso(T.pend + ' pedido(s) por marcar como pago (' + eurCent(T.pendCent) + ')', PDFU.AMBAR);
    const semOk = mesDados.filter(d => d.st.tipo !== 'ok' && d.st.texto !== 'sem movimento').length;
    if (semOk) c.aviso(semOk + ' dia(s) com a caixa por confirmar ou com diferença', PDFU.AMBAR);
    const dd = d => { const [y, mo, di] = d.split('-'); return ['dom','seg','ter','qua','qui','sex','sáb'][new Date(+y, +mo - 1, +di).getDay()] + ' ' + di + '/' + mo; };
    c.tabela(
      [{ h: 'Dia', w: 24 }, { h: 'Rec.', w: 10, a: 'r' }, { h: 'Ent./Lev.', w: 16, a: 'r' }, { h: 'Dinheiro', w: 19, a: 'r' }, { h: 'MB Way', w: 19, a: 'r' }, { h: 'Total', w: 20, a: 'r' }, { h: 'Caixa', w: 52 }],
      mesDados.map(d => [dd(d.dia), String(d.n), d.ent + ' / ' + d.ret, eurCent(d.din), eurCent(d.mb), { t: eurCent(d.total), b: true }, { t: d.st.texto + (d.pend ? ' · ' + d.pend + ' por pagar' : ''), cor: corEstado(d.st.tipo) }]),
      { totalRow: ['Total', String(T.n), T.ent + ' / ' + T.ret, eurCent(T.din), eurCent(T.mb), eurCent(T.total), ''] });
    if (detalhe) {
      const porDia = {};
      mesPedidos.filter(p => !p.ensaio && p.estado !== 'cancelado').forEach(p => { (porDia[p.dia] = porDia[p.dia] || []).push(p); });
      const fechos = {}; mesDados.forEach(d => { if (d.fecho) fechos[d.dia] = d.fecho; });
      Object.keys(porDia).sort().forEach(dia => { c.forcaNova(); pdfSecaoDia(c, dia, porDia[dia], fechos[dia] || null); });
    }
    c.guardar('recibos-esfiha-da-casa-' + m + (detalhe ? '-com-recibos' : '') + '.pdf');
  }

  (function () {
    const g = localStorage.getItem('painelPass');
    if (g) {
      pass = g;
      api('/painel/pedidos').then(() => {
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = '';
        document.getElementById('diaSel').value = diaLisboaHoje();
        NAVD.diaInit('diaSel', carregar);
        relogio(); setInterval(relogio, 1000);
        carregar();
      }).catch(() => {});
    }
  })();
</script>
</body>
</html>
